[package]
name = "crow-browser"
version = "0.1.1"
edition = "2024"

[dependencies]
tao = "0.37"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
mimalloc = { version = "0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
sha2 = "0.10"
# EasyList/EasyPrivacy parsing, converted to WebKit content-blocker rules (no runtime engine)
adblock = { version = "0.13", default-features = false, features = ["content-blocking", "embedded-domain-resolver"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.21"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSString", "NSArray", "NSDictionary", "NSHTTPCookie", "NSDate", "NSError", "NSSet", "NSObject",
    "NSData", "NSValue",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSImage", "NSResponder",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std", "block2", "WKWebView", "WKWebsiteDataStore", "WKWebsiteDataRecord", "WKHTTPCookieStore",
    "WKWebViewConfiguration", "WKUserContentController", "WKContentRuleList", "WKContentRuleListStore",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_40"] }
soup3 = "0.5"
png = "0.18"

[profile.dev]
opt-level = 0
debug = "line-tables-only"
incremental = true
lto = false
codegen-units = 256

[profile.dev.package."*"]
opt-level = 1
debug = false

# Argon2 is unusably slow unoptimized
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true
debug = false
