<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <title>CrowBrowser Inštalátor</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26346f"/>
      <stop offset="0.6" stop-color="#18204a"/>
      <stop offset="1" stop-color="#0d1129"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#6c9bff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6c9bff" stop-opacity="0"/>
    </radialGradient>
    <marker id="head" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8fb1ff"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#glow)"/>

  <!-- subtle globe lines -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2">
    <circle cx="330" cy="215" r="250"/>
    <ellipse cx="330" cy="215" rx="110" ry="250"/>
    <path d="M80 215 H580"/>
  </g>

  <g font-family="-apple-system, 'Helvetica Neue', Helvetica, sans-serif" text-anchor="middle">
    <text x="330" y="62" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="0.5">CrowBrowser</text>
    <text x="330" y="90" font-size="14" fill="#b8c6ff">Presuň CrowBrowser do priečinka Aplikácie</text>
    <text x="330" y="372" font-size="11.5" fill="#8a97c9" letter-spacing="0.4">Súkromný · Šifrovaný · Ľahký prehliadač pre macOS</text>
  </g>

  <!-- drag arrow between app (170,215) and Applications (490,215) -->
  <path d="M 258 205 C 300 178, 360 178, 402 205" fill="none" stroke="#8fb1ff" stroke-width="4"
        stroke-linecap="round" stroke-dasharray="2 10" marker-end="url(#head)"/>
</svg>
