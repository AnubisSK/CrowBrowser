<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c9bff"/>
      <stop offset="0.55" stop-color="#3b5bdb"/>
      <stop offset="1" stop-color="#1c2554"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bird" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1d2b"/>
      <stop offset="1" stop-color="#07080d"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2f45"/>
      <stop offset="1" stop-color="#0d0f17"/>
    </linearGradient>
    <clipPath id="sq">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>

  <!-- macOS squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <!-- globe orbit -->
    <circle cx="512" cy="512" r="300" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="18"/>
    <ellipse cx="512" cy="512" rx="130" ry="300" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="14"/>
    <path d="M212 512 H812" stroke="#ffffff" stroke-opacity="0.12" stroke-width="14"/>

    <!-- crow: head, neck and chest -->
    <path fill="url(#bird)" d="
      M 300 924
      C 300 760, 290 640, 330 540
      C 365 450, 420 375, 505 345
      C 570 322, 640 330, 690 368
      L 690 368
      C 660 395, 652 430, 660 470
      C 640 470, 615 478, 600 500
      C 640 560, 655 640, 650 730
      C 645 800, 660 870, 700 924 Z"/>
    <!-- beak -->
    <path fill="url(#beak)" d="
      M 660 372
      C 730 380, 800 410, 860 452
      C 790 455, 720 462, 662 478
      C 650 440, 650 405, 660 372 Z"/>
    <path d="M 664 432 C 730 438, 800 446, 852 452" stroke="#3c4363" stroke-width="5" fill="none" stroke-linecap="round"/>
    <!-- eye -->
    <circle cx="575" cy="405" r="24" fill="#6c9bff"/>
    <circle cx="575" cy="405" r="11" fill="#0b0d14"/>
    <circle cx="582" cy="398" r="5" fill="#ffffff"/>
    <!-- feather sheen -->
    <path d="M 360 600 C 400 520, 450 470, 520 440" stroke="#5b6bb0" stroke-opacity="0.35" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M 350 700 C 390 620, 440 570, 520 540" stroke="#5b6bb0" stroke-opacity="0.22" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
</svg>
