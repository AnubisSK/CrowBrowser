[package]
name = "crow-proto"
version = "0.1.0"
edition = "2024"
description = "Wire protocol shared by CrowBrowser and crow-server"
publish = false

[dependencies]
argon2 = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snow = "0.10"
tokio = { version = "1", features = ["io-util", "macros", "net", "time"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
zeroize = { version = "1", features = ["derive"] }
