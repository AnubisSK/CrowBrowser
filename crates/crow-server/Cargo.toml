[package]
name = "crow-server"
version = "0.1.0"
edition = "2024"
description = "CrowBrowser remote execution node: Eco Reader, Remote Browser Isolation and private tunnel"
publish = false

[dependencies]
crow-proto = { path = "../crow-proto" }
base64 = "0.22"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
mimalloc = { version = "0.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "gzip", "rustls-tls-webpki-roots"] }
scraper = "0.26"
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
url = "2"
webp = { version = "0.3", default-features = false }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake"] }
