<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg: #18181b; --card: #222226; --line: #2f2f35; --fg: #e6e6e9; --mute: #9a9aa3; --input: #2a2a2f; --accent: #5b8def; --danger: #e5534b; --lights-off: #4a4a50; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #f4f4f6; --card: #fff; --line: #e3e3e8; --fg: #1d1d1f; --mute: #6e6e76; --input: #f0f0f3; --lights-off: #d1d1d6; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, system-ui, "Inter", "Cantarell", "Noto Sans", sans-serif; user-select: none; -webkit-user-select: none;
  }
  .card { width: 360px; padding: 32px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
  .logo { width: 96px; height: 96px; margin: -8px auto 8px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.3)); }
  .logo svg { width: 100%; height: 100%; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  p { color: var(--mute); line-height: 1.45; margin-bottom: 20px; }
  input {
    width: 100%; height: 36px; padding: 0 12px; margin-bottom: 10px; border-radius: 9px; outline: none;
    border: 1px solid transparent; background: var(--input); color: var(--fg); font: inherit;
  }
  input:focus { border-color: var(--accent); }
  button.primary {
    width: 100%; height: 36px; margin-top: 4px; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  }
  button.primary:disabled { opacity: .6; }
  .err { color: var(--danger); min-height: 18px; margin-top: 10px; }
  .warn { font-size: 12px; margin: 14px 0 0; }
  .link { background: none; border: 0; color: var(--mute); font: inherit; font-size: 12px; margin-top: 14px; text-decoration: underline; }
  .link.armed { color: var(--danger); }
  /* Linux (frameless): drawn copy of the macOS traffic lights */
  #lights { display: none; position: fixed; left: 13px; top: 12px; gap: 8px; z-index: 10; }
  body.chrome #lights { display: flex; }
  #lights span { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
  #lights .c { background: #ff5f57; } #lights .m { background: #febc2e; } #lights .x { background: #28c840; }
  body.blurred #lights:not(:hover) span { background: var(--lights-off, #4a4a50); }
  #lights svg { width: 8px; height: 8px; fill: none; stroke: rgba(0,0,0,.55); stroke-width: 3; stroke-linecap: round; opacity: 0; }
  #lights:hover svg { opacity: 1; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body>
  <div id="lights">
    <span class="c" data-c="win-close"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></span>
    <span class="m" data-c="win-min"><svg viewBox="0 0 10 10"><path d="M1.5 5h7"/></svg></span>
    <span class="x" data-c="win-max"><svg viewBox="0 0 10 10"><path d="M5 1.5v7M1.5 5h7"/></svg></span>
  </div>
  <form class="card" id="card" autocomplete="off">
    <div class="logo">/*LOGO*/</div>
    <h1 id="h"></h1>
    <p id="d"></p>
    <input type="password" id="pw" autofocus>
    <input type="password" id="pw2" data-i18n-ph="repeat_password">
    <button class="primary" id="go" type="submit"></button>
    <div class="err" id="err"></div>
    <p class="warn" id="warn" data-i18n="pw_not_saved_warning"></p>
    <button class="link" id="reset" type="button" data-i18n="forgot_password"></button>
  </form>
<script>
  const MODE = /*MODE*/;
  const $ = (id) => document.getElementById(id);
  const send = (m) => window.ipc.postMessage(m);
  const create = MODE === 'create';

  $('h').textContent = t(create ? 'welcome' : 'locked');
  $('d').textContent = t(create ? 'create_desc' : 'unlock_desc');
  $('pw').placeholder = t(create ? 'new_password_hint' : 'master_password');
  $('go').textContent = t(create ? 'create_vault' : 'unlock');
  $('pw2').style.display = create ? '' : 'none';
  $('warn').style.display = create ? '' : 'none';
  $('reset').style.display = create ? 'none' : '';

  document.body.onmousedown = (e) => { if (e.target === document.body) send('drag'); };

  document.querySelectorAll('#lights span').forEach(l => l.onclick = () => send(l.dataset.c));
  $('lights').onmousedown = (e) => { if (e.target.id === 'lights') send('drag'); };
  function setFocus(on) { document.body.classList.toggle('blurred', !on); }

  $('card').onsubmit = (e) => {
    e.preventDefault();
    const pw = $('pw').value;
    if (create) {
      if ([...pw].length < 8) return fail(t('pw_too_short'));
      if (pw !== $('pw2').value) return fail(t('pw_mismatch'));
    }
    if (!pw) return;
    $('err').textContent = '';
    $('go').disabled = true;
    $('go').textContent = t(create ? 'creating' : 'unlocking');
    // let the label repaint before key derivation blocks the UI thread
    setTimeout(() => send((create ? 'create:' : 'unlock:') + pw), 60);
  };

  function fail(msg) {
    $('err').textContent = msg;
    $('go').disabled = false;
    $('go').textContent = t(create ? 'create_vault' : 'unlock');
    $('pw').value = ''; $('pw2').value = ''; $('pw').focus();
    const c = $('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  }

  const reset = $('reset');
  reset.onclick = () => {
    if (!reset.classList.contains('armed')) {
      reset.classList.add('armed');
      reset.textContent = t('forgot_confirm');
      setTimeout(() => { reset.classList.remove('armed'); reset.textContent = t('forgot_password'); }, 4000);
      return;
    }
    send('reset');
  };
</script>
</body>
</html>
