<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg: #18181b; --card: #222226; --line: #2f2f35; --fg: #e6e6e9; --mute: #9a9aa3; --input: #2a2a2f; --accent: #5b8def; --danger: #e5534b; --lights-off: #4a4a50; }
  @media (prefers-color-scheme: light) {
    :root { color-scheme: light; --bg: #f4f4f6; --card: #fff; --line: #e3e3e8; --fg: #1d1d1f; --mute: #6e6e76; --input: #f0f0f3; --lights-off: #d1d1d6; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: grid; place-items: center; background: var(--bg); color: var(--fg);
    font: 13px -apple-system, BlinkMacSystemFont, system-ui, "Inter", "Cantarell", "Noto Sans", sans-serif; user-select: none; -webkit-user-select: none;
  }
  .card { width: 360px; padding: 32px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; text-align: center; }
  .logo { width: 96px; height: 96px; margin: -8px auto 8px; filter: drop-shadow(0 6px 14px rgba(0,0,0,.3)); }
  .logo svg { width: 100%; height: 100%; }
  h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  p { color: var(--mute); line-height: 1.45; margin-bottom: 20px; }
  input {
    width: 100%; height: 36px; padding: 0 12px; margin-bottom: 10px; border-radius: 9px; outline: none;
    border: 1px solid transparent; background: var(--input); color: var(--fg); font: inherit;
  }
  input:focus { border-color: var(--accent); }
  button.primary {
    width: 100%; height: 36px; margin-top: 4px; border: 0; border-radius: 9px;
    background: var(--accent); color: #fff; font: inherit; font-weight: 600;
  }
  button.primary:disabled { opacity: .6; }
  #profiles { display: grid; gap: 6px; margin-bottom: 12px; max-height: 176px; overflow-y: auto; }
  .prof { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 10px; border-radius: 9px; border: 1px solid transparent; background: var(--input); color: var(--fg); font: inherit; text-align: left; }
  .prof.on { border-color: var(--accent); }
  .prof .av { flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; }
  .prof .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chk { display: flex; align-items: flex-start; gap: 8px; margin: 2px 0 10px; color: var(--mute); font-size: 12px; text-align: left; line-height: 1.4; }
  .chk input { width: auto; height: auto; margin: 2px 0 0; flex: none; }
  .err { color: var(--danger); min-height: 18px; margin-top: 10px; }
  .warn { font-size: 12px; margin: 14px 0 0; }
  .link { background: none; border: 0; color: var(--mute); font: inherit; font-size: 12px; margin-top: 14px; text-decoration: underline; }
  .link.armed { color: var(--danger); }
  /* Linux (frameless): drawn copy of the macOS traffic lights */
  #lights { display: none; position: fixed; left: 13px; top: 12px; gap: 8px; z-index: 10; }
  body.chrome #lights { display: flex; }
  #lights span { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
  #lights .c { background: #ff5f57; } #lights .m { background: #febc2e; } #lights .x { background: #28c840; }
  body.blurred #lights:not(:hover) span { background: var(--lights-off, #4a4a50); }
  #lights svg { width: 8px; height: 8px; fill: none; stroke: rgba(0,0,0,.55); stroke-width: 3; stroke-linecap: round; opacity: 0; }
  #lights:hover svg { opacity: 1; }
  /* Windows (borderless, client-side decorations): caption buttons top right, the page moves
     the window, the 4 px strip on top resizes it. */
  #caps, #rsz { display: none; }
  body.windows #caps { display: flex; position: fixed; top: 0; right: 0; height: 32px; z-index: 10; }
  #caps button { width: 46px; height: 100%; border: 0; border-radius: 0; background: transparent; color: var(--fg);
    display: grid; place-items: center; }
  #caps button:hover { background: rgba(128, 128, 128, .18); }
  #caps .close:hover { background: #e81123; color: #fff; }
  #caps .close:active { background: #f1707a; color: #fff; }
  body.blurred #caps button:not(:hover) { color: var(--mute); }
  #caps svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1; }
  #caps .restore, body.maximized #caps .max { display: none; }
  body.maximized #caps .restore { display: block; }
  body.windows:not(.maximized) #rsz { display: block; position: fixed; left: 0; right: 0; top: 0; height: 4px; z-index: 20; cursor: ns-resize; }
  .shake { animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
</style>
</head>
<body>
  <div id="lights">
    <span class="c" data-c="win-close"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></span>
    <span class="m" data-c="win-min"><svg viewBox="0 0 10 10"><path d="M1.5 5h7"/></svg></span>
    <span class="x" data-c="win-max"><svg viewBox="0 0 10 10"><path d="M5 1.5v7M1.5 5h7"/></svg></span>
  </div>
  <div id="caps">
    <button type="button" data-c="window-minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
    <button type="button" data-c="window-maximize"><svg class="max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="restore" viewBox="0 0 10 10"><path d="M2.5 2.5V.5h7v7h-2"/><rect x=".5" y="2.5" width="7" height="7"/></svg></button>
    <button type="button" class="close" data-c="window-close"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
  </div>
  <div id="rsz"></div>
  <form class="card" id="card" autocomplete="off">
    <div class="logo">/*LOGO*/</div>
    <h1 id="h"></h1>
    <p id="d"></p>
    <div id="profiles"></div>
    <input type="text" id="name" maxlength="40" spellcheck="false" data-i18n-ph="profile_name">
    <input type="password" id="pw" autofocus>
    <input type="password" id="pw2" data-i18n-ph="repeat_password">
    <input type="text" id="code" maxlength="10" spellcheck="false" data-i18n-ph="reset_code">
    <label class="chk" id="hideopt"><input type="checkbox" id="hide"><span data-i18n="profile_hidden_opt"></span></label>
    <button class="primary" id="go" type="submit"></button>
    <div class="err" id="err"></div>
    <p class="warn" id="warn" data-i18n="pw_not_saved_warning"></p>
    <button class="link" id="other" type="button"></button>
    <button class="link" id="openhidden" type="button" data-i18n="profile_hidden_open"></button>
    <button class="link" id="reset" type="button" data-i18n="forgot_password"></button>
  </form>
<script>
  const PROFILES = /*PROFILES*/;
  const $ = (id) => document.getElementById(id);
  const send = (m) => window.ipc.postMessage(m);
  // Window drag: plain left press on the empty strip itself, never on controls; the default
  // (focus/selection) is suppressed so WebKit does not handle the same press too. A double click
  // keeps its own meaning instead of starting a second drag.
  const dragOn = (el, ok) => el.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || e.detail > 1 || !ok(e) || e.target.closest('button, input, .tab, .no-drag')) return;
    e.preventDefault();
    send('drag');
  });
  // 'pick' a listed profile, 'new', 'hidden' (typed label), 'reset' (delete the selected one).
  let mode = PROFILES.length ? 'pick' : 'new', selected = PROFILES[0] || null, resetCode = '';
  const home = () => (PROFILES.length ? 'pick' : 'new');
  const setMode = (m) => { mode = m; render(); };
  const goLabel = () => t(mode === 'new' ? 'create_vault' : mode === 'reset' ? 'reset_confirm' : 'unlock');
  const shown = (id, on) => { $(id).style.display = on ? '' : 'none'; };

  function pick(p) {
    selected = p;
    render();
  }

  function row(p) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'prof' + (p === selected ? ' on' : '');
    b.onclick = () => pick(p);
    const av = document.createElement('span');
    av.className = 'av';
    av.textContent = [...p.name].slice(0, 1).join('').toUpperCase();
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = p.name;
    b.append(av, nm);
    return b;
  }

  function render() {
    const create = mode === 'new', picking = mode === 'pick', deleting = mode === 'reset';
    $('h').textContent = t(deleting ? 'reset_title' : mode === 'hidden' ? 'profile_hidden_open' : picking ? 'locked' : PROFILES.length ? 'profile_new' : 'welcome');
    $('d').textContent = deleting ? t('reset_prompt', selected.name, resetCode) : t(create ? 'create_desc' : 'unlock_desc');
    $('pw').placeholder = t(create ? 'new_password_hint' : 'master_password');
    $('go').textContent = goLabel();
    $('go').disabled = false;
    $('profiles').replaceChildren(...(picking ? PROFILES.map(row) : []));
    $('name').value = create && !PROFILES.length ? t('profile_personal') : '';
    $('code').value = '';
    $('hide').checked = false;
    shown('profiles', picking);
    shown('name', !picking);
    shown('pw', !deleting);
    shown('pw2', create);
    shown('code', deleting);
    shown('hideopt', create);
    shown('warn', create);
    shown('reset', picking && selected && !selected.locked);
    shown('other', !create || PROFILES.length > 0);
    shown('openhidden', mode === home());
    $('other').textContent = t(picking ? 'profile_new' : 'back');
    $('err').textContent = '';
    $('pw').value = ''; $('pw2').value = '';
    $(picking ? 'pw' : 'name').focus();
  }

  $('other').onclick = () => setMode(mode === 'pick' ? 'new' : home());
  $('openhidden').onclick = () => setMode('hidden');
  render();

  dragOn(document.body, (e) => e.target === document.body);

  document.querySelectorAll('#lights span').forEach(l => l.onclick = () => send(l.dataset.c));
  dragOn($('lights'), (e) => e.target.id === 'lights');
  function setFocus(on) { document.body.classList.toggle('blurred', !on); }
  document.querySelectorAll('#caps button').forEach(b => b.onclick = () => send(b.dataset.c));
  function setMax(on) { document.body.classList.toggle('maximized', on); }
  $('rsz').addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    send('resize:' + (e.clientX < 8 ? 'nw' : e.clientX >= innerWidth - 8 ? 'ne' : 'n'));
  });

  $('card').onsubmit = (e) => {
    e.preventDefault();
    const name = $('name').value;
    if (mode === 'reset') {
      const message = 'reset:' + JSON.stringify({ id: selected.id, name, code: $('code').value });
      setMode('pick'); // the code is spent: an error is shown on the list
      return send(message);
    }
    const create = mode === 'new', hide = $('hide').checked;
    let pw = $('pw').value, again = $('pw2').value;
    scrub();
    if (create) {
      if (!name.trim()) return fail(t('profile_name_invalid'));
      if ([...pw].length < 12) return fail(t('pw_too_short'));
      if (pw !== again) return fail(t('pw_mismatch'));
    }
    if (!pw) return;
    $('err').textContent = '';
    $('go').disabled = true;
    $('go').textContent = t(create ? 'creating' : 'unlocking');
    // The host delays key derivation itself, so the label repaints without holding the value here.
    send(create ? 'create:' + JSON.stringify({ name, password: pw, hidden: hide })
      : mode === 'hidden' ? 'unlock-hidden:' + JSON.stringify({ name, password: pw })
      : 'unlock:' + selected.id + ':' + pw);
    pw = again = '';
  };

  // The fields are emptied and replaced at once: the old elements and their values have no owner.
  function scrub() {
    for (const id of ['pw', 'pw2']) {
      const old = $(id);
      old.value = '';
      old.replaceWith(old.cloneNode(false));
    }
  }

  function fail(msg) {
    $('err').textContent = msg;
    $('go').disabled = false;
    $('go').textContent = goLabel();
    $('pw').value = ''; $('pw2').value = ''; $('pw').focus();
    const c = $('card'); c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
  }

  $('reset').onclick = () => { if (selected) send('reset-ask:' + selected.id); };
  function askReset(code) { resetCode = code; setMode('reset'); }
</script>
</body>
</html>
