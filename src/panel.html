<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #18181b; --side: #1d1d21; --card: #222226; --line: #2f2f35; --fg: #e6e6e9; --mute: #9a9aa3;
    --input: #2a2a2f; --hover: #2a2a30; --accent: #5b8def; --danger: #e5534b; --ok: #3fb950;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #f4f4f6; --side: #ececf0; --card: #fff; --line: #e3e3e8; --fg: #1d1d1f; --mute: #6e6e76;
      --input: #f0f0f3; --hover: #f0f0f4;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body { display: flex; background: var(--bg); color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, system-ui, "Inter", "Cantarell", "Noto Sans", sans-serif; }
  nav { width: 200px; flex: none; background: var(--side); border-right: 1px solid var(--line); padding: 20px 10px; user-select: none; -webkit-user-select: none; display: flex; flex-direction: column; }
  #news { margin-top: auto; padding: 8px 12px; border-radius: 8px; color: var(--mute); font-size: 12px; cursor: pointer; }
  #news:hover { background: var(--hover); color: var(--accent); }
  nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 12px; margin-bottom: 2px;
    border: 0; border-radius: 8px; background: transparent; color: var(--fg); font: inherit; text-align: left;
  }
  nav button:hover { background: var(--hover); }
  nav button.on { background: var(--accent); color: #fff; }
  nav svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  main { flex: 1; overflow-y: auto; padding: 28px 32px 48px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; flex: 1; }
  h2 { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 24px 4px 8px; }
  h3 { font-size: 12px; font-weight: 600; color: var(--mute); margin: 18px 4px 6px; }
  section, .list { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 16px; min-height: 52px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row small { display: block; color: var(--mute); margin-top: 2px; }
  select, input[type=text], input[type=password], input[type=search] {
    background: var(--input); color: var(--fg); font: inherit;
    border: 1px solid transparent; border-radius: 8px; height: 30px; padding: 0 10px; outline: none;
  }
  input[type=text] { width: 280px; }
  input[type=search] { width: 260px; }
  select:focus, input:focus { border-color: var(--accent); }
  .seg { display: flex; background: var(--input); border-radius: 8px; padding: 2px; flex: none; }
  .seg button { border: 0; background: transparent; color: var(--fg); font: inherit; padding: 5px 12px; border-radius: 6px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .btn { border: 1px solid var(--line); background: var(--input); color: var(--fg); font: inherit; padding: 6px 14px; border-radius: 8px; white-space: nowrap; }
  .btn:hover { border-color: var(--mute); }
  .btn.danger { color: var(--danger); }
  .btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .pw { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .pw input { width: 100%; }
  .pw .btn { align-self: flex-start; }
  #close { width: 32px; height: 32px; border-radius: 16px; border: 0; background: var(--input); color: var(--fg); font-size: 16px; }

  .item { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 16px; min-height: 44px; }
  .item + .item { border-top: 1px solid var(--line); }
  .item:hover { background: var(--hover); }
  .item .main { flex: 1; min-width: 0; cursor: pointer; }
  .item .title, .item .sub { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .item .sub { color: var(--mute); font-size: 12px; margin-top: 1px; }
  .item .time { color: var(--mute); font-size: 12px; width: 44px; flex: none; }
  .item .del { width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent; color: var(--mute); font-size: 16px; opacity: 0; }
  .item:hover .del { opacity: 1; }
  .item .del:hover { background: var(--input); color: var(--fg); }
  .state { font-size: 12px; flex: none; }
  .state.active { color: var(--accent); } .state.failed { color: var(--danger); } .state.done { color: var(--ok); }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; flex: none; background: var(--input); color: var(--mute); }
  .badge.on { background: rgba(91, 141, 239, .18); color: var(--accent); }
  .item .fdot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); opacity: .5; flex: none; }
  .item .fdot.on { background: var(--accent); opacity: 1; }
  .item .user { color: var(--mute); width: 110px; flex: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 32px; text-align: center; color: var(--mute); }

  /* Network & proxy */
  .plist { display: flex; flex-direction: column; gap: 2px; }
  .pradio { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; cursor: pointer; }
  .pradio input { margin-top: 2px; accent-color: var(--accent); }
  .pradio small { display: block; color: var(--mute); margin-top: 2px; }
  .pcustom { margin: 2px 0 8px 26px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 10px; }
  .pcustom[hidden] { display: none; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .pfield { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); }
  .pfield input, .pfield select { width: 100%; }
  .badge.tor { background: rgba(125, 78, 200, .2); color: #b48cf2; }
  .presult.ok { color: var(--ok); } .presult.err { color: var(--danger); } .presult.warn { color: #d29922; }

  #toast {
    position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px);
    background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 8px;
    opacity: 0; transition: .2s; pointer-events: none;
  }
  #toast.err { background: var(--danger); }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
<nav>
  <button data-s="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.2 4.2l2.8 2.8M17 17l2.8 2.8M1 12h4M19 12h4M4.2 19.8 7 17M17 7l2.8-2.8"/></svg><span data-i18n="settings"></span></button>
  <button data-s="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg><span data-i18n="history"></span></button>
  <button data-s="bookmarks"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg><span data-i18n="bookmarks"></span></button>
  <button data-s="downloads"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg><span data-i18n="downloads"></span></button>
  <button data-s="logins"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg><span data-i18n="logins"></span></button>
  <button data-s="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg><span data-i18n="about"></span></button>
  <div id="news" role="link" title="crow:changelog"></div>
</nav>
<main><div class="wrap" id="root"></div></main>
<div id="toast"></div>
<script>
  let D = /*DATA*/;
  let section = D.section || 'settings';
  let query = '';
  const send = (m) => window.ipc.postMessage(m);
  const set = (k, v) => { send('set:' + k + '=' + v); D.settings[k] = v; toast(t('saved')); };
  const root = document.getElementById('root');

  function h(tag, props = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k.startsWith('on')) el[k] = v; else if (k === 'class') el.className = v; else el.setAttribute(k, v);
    }
    for (const k of kids.flat()) if (k != null) el.append(k);
    return el;
  }

  function toast(msg, err) {
    const el = document.getElementById('toast');
    el.textContent = msg; el.classList.toggle('err', !!err); el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800);
  }

  function confirmBtn(label, onConfirm) {
    const b = h('button', { class: 'btn danger' }, label);
    b.onclick = () => {
      if (!b._armed) {
        b._armed = true; b.textContent = t('confirm_sure');
        setTimeout(() => { b._armed = false; b.textContent = label; }, 3000);
        return;
      }
      b._armed = false; b.textContent = label; onConfirm();
    };
    return b;
  }

  function seg(key, opts) {
    const el = h('div', { class: 'seg' });
    const mark = () => el.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v === String(D.settings[key] === true ? 'on' : D.settings[key] === false ? 'off' : D.settings[key])));
    for (const [v, label] of opts) {
      const b = h('button', { 'data-v': v }, label);
      b.onclick = () => { set(key, v); D.settings[key] = v === 'on' ? true : v === 'off' ? false : v; mark(); };
      el.append(b);
    }
    mark();
    return el;
  }

  function select(key, opts) {
    const s = h('select');
    for (const [v, label] of opts) s.add(new Option(label, v, false, String(v) === String(D.settings[key])));
    s.onchange = () => set(key, s.value);
    return s;
  }

  const row = (label, sub, control) => h('div', { class: 'row' }, h('div', {}, label, sub ? h('small', {}, sub) : null), control);
  const header = (title, ...extra) => h('header', {}, h('h1', {}, title), ...extra, h('button', { id: 'close', title: t('close') + ' (Esc)', onclick: () => send('panel-close') }, '✕'));

  function host(u) { try { return new URL(u).host; } catch { return u; } }
  // Timestamps are `ms`, never `t`: that name is the translation function.
  function fmtTime(ms) { return new Date(ms).toLocaleTimeString(currentLanguage(), { hour: '2-digit', minute: '2-digit' }); }
  function fmtDay(ms) {
    const d = new Date(ms), today = new Date();
    const y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return t('today');
    if (d.toDateString() === y.toDateString()) return t('yesterday');
    return d.toLocaleDateString(currentLanguage(), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }
  const openUrl = (u, e) => send((e && (e.metaKey || e.ctrlKey) ? 'open-new:' : 'open:') + u);

  // Ad-block filter lists: sources (downloaded when), rule counts per WebKit list, toggles.
  function adblockLists() {
    const L = D.adblockLists || { sources: [] };
    const n = (x) => (x || 0).toLocaleString(currentLanguage());
    const src = (file) => L.sources.find(s => s.file === file) || {};
    const when = (s) => s.time ? t('list_downloaded', fmtDay(s.time) + ' ' + fmtTime(s.time)) : t('list_not_downloaded');
    const count = (l) => l ? t.plural(l.rules, 'rules', n(l.rules)) + (l.lists > 1 ? ' ' + t('in_lists', l.lists) : '') + (l.truncated ? ' (' + t('cosmetic_dropped', n(l.dropped)) + ')' : '') : t('preparing');
    const item = (title, sub, ...controls) => h('div', { class: 'item' },
      h('div', { class: 'main' }, h('div', { class: 'title' }, title), h('div', { class: 'sub' }, sub)), ...controls);
    return h('div', { class: 'row', style: 'display:block' },
      h('div', {}, t('adblock_lists'), h('small', {}, t('adblock_lists_desc'))),
      h('div', { class: 'list', style: 'margin-top:10px' },
        item(t('main_list', count(L.main)),
          t('builtin_list', n(L.builtin)) + ' + blocklist.txt' + (D.settings.adblock_easylist ? ' + EasyList (' + when(src('easylist.txt')) + ') + EasyPrivacy (' + when(src('easyprivacy.txt')) + ')' : '')),
        item(t('easylist_title'), t('easylist_desc'), seg('adblock_easylist', [['on', t('switch_on')], ['off', t('switch_off')]])),
        item('StevenBlack hosts: ' + (D.settings.adblock_hosts ? count(L.hosts) : t('list_disabled')),
          D.settings.adblock_hosts ? t('hosts_desc', when(src('hosts-stevenblack.txt'))) : 'github.com/StevenBlack/hosts',
          seg('adblock_hosts', [['on', t('list_on')], ['off', t('list_off')]])),
        item(t('update_lists_now'), t('update_lists_desc'),
          h('button', { class: 'btn', onclick: () => send('adblock-update') }, t('update_btn')))));
  }

  // Default browser: status badge + button; the result arrives as `setDefaultBrowser(status)`.
  function defaultBrowserRow() {
    const badge = h('span', { class: 'badge' });
    const btn = h('button', { class: 'btn primary' }, t('set_default'));
    btn.onclick = () => { btn.disabled = true; send('set-as-default-browser'); };
    const paint = (st) => {
      badge.classList.toggle('on', !!(st && st.is_default));
      badge.textContent = !st ? t('checking') : !st.available ? t('default_browser_unavailable')
        : t(st.is_default ? 'default_browser_yes' : 'default_browser_no');
      btn.hidden = !!(st && (st.is_default || !st.available));
      btn.disabled = !st;
    };
    window.setDefaultBrowser = (st) => { D.defaultBrowser = st; paint(st); };
    paint(D.defaultBrowser);
    send('get-default-browser-status');
    return row(t('default_browser'), null, h('div', { style: 'display:flex;gap:8px;align-items:center' }, badge, btn));
  }

  // Network & proxy (RAM only: every session starts direct). Answers from the backend:
  // `proxyApplied(state)`, `proxyResult(false, key)`, `proxyTest({ ok, ip, tor, err })`.
  function proxySection() {
    const P = D.proxy || { mode: 'direct' };
    let mode = P.mode;
    const field = (label, el) => h('label', { class: 'pfield' }, h('span', {}, label), el);
    const proto = h('select');
    proto.add(new Option('SOCKS5', 'socks5'));
    proto.add(new Option('HTTP', 'http'));
    proto.value = P.protocol || 'socks5';
    const hostI = h('input', { type: 'text', spellcheck: 'false', autocomplete: 'off', placeholder: '127.0.0.1' });
    hostI.value = P.host || '';
    const portI = h('input', { type: 'text', inputmode: 'numeric', autocomplete: 'off', placeholder: '1080', class: 'port' });
    portI.value = P.port || '';
    const userI = h('input', { type: 'text', spellcheck: 'false', autocomplete: 'off' });
    userI.value = P.user || '';
    const passI = h('input', { type: 'password', autocomplete: 'new-password', placeholder: P.hasPass ? t('proxy_pass_kept') : '' });
    const applyBtn = h('button', { class: 'btn primary' }, t('proxy_apply'));
    const custom = h('div', { class: 'pcustom' },
      h('div', { class: 'pgrid' }, field(t('proxy_protocol'), proto), field(t('proxy_host'), hostI), field(t('proxy_port'), portI),
        field(t('proxy_user'), userI), field(t('proxy_pass'), passI)),
      h('div', {}, applyBtn));
    const badge = h('span', { class: 'badge' });
    const result = h('small', { class: 'presult' });
    const testBtn = h('button', { class: 'btn' }, t('proxy_test'));
    const radios = [];
    const opt = (v, label, sub) => {
      const r = h('input', { type: 'radio', name: 'proxy', value: v });
      r.onchange = () => { mode = v; paint(); if (v !== 'custom') apply(); };
      radios.push(r);
      return h('label', { class: 'pradio' }, r, h('div', {}, label, sub ? h('small', {}, sub) : null));
    };
    const list = h('div', { class: 'plist' },
      opt('direct', t('proxy_direct'), D.proxyDirectIsSystem ? t('proxy_direct_is_system') : null),
      opt('system', t('proxy_system')),
      opt('custom', t('proxy_custom')),
      custom,
      opt('tor', t('proxy_tor'), t('proxy_tor_desc')));
    let busy = !!D.proxyBusy;
    function paint() {
      for (const r of radios) { r.checked = r.value === mode; r.disabled = busy; }
      custom.hidden = mode !== 'custom';
      applyBtn.disabled = testBtn.disabled = busy;
      const active = P.mode;
      badge.classList.toggle('on', active === 'tor' || active === 'custom');
      badge.classList.toggle('tor', active === 'tor');
      badge.textContent = busy ? t('proxy_switching') : active === 'tor' ? '🧅 ' + t('proxy_badge_tor')
        : active === 'custom' ? t('proxy_badge_custom') : active === 'system' ? t('proxy_system') : t('proxy_badge_direct');
    }
    function apply() {
      busy = true; paint(); result.textContent = '';
      send('set-proxy-mode:' + JSON.stringify({ mode, protocol: proto.value, host: hostI.value.trim(),
        port: Number(portI.value) || 0, user: userI.value, pass: passI.value, keep_pass: !passI.value && !!P.hasPass }));
      passI.value = '';
    }
    applyBtn.onclick = apply;
    testBtn.onclick = () => {
      testBtn.disabled = true; result.className = 'presult'; result.textContent = t('proxy_testing');
      send('test-proxy-connection');
    };
    window.proxyApplied = (st) => {
      Object.keys(P).forEach(k => delete P[k]); Object.assign(P, st); D.proxy = P;
      mode = P.mode; busy = false; passI.placeholder = P.hasPass ? t('proxy_pass_kept') : ''; paint();
    };
    window.proxyResult = (ok, key) => { busy = false; mode = P.mode; paint(); if (!ok) toast(t(key), true); };
    window.proxyTest = (r) => {
      testBtn.disabled = busy;
      result.className = 'presult ' + (r.ok ? (P.mode === 'tor' && !r.tor ? 'warn' : 'ok') : 'err');
      result.textContent = !r.ok ? t(r.err)
        : r.tor ? t('proxy_test_tor', r.ip) : P.mode === 'tor' ? t('proxy_test_not_tor', r.ip) : t('proxy_test_ok', r.ip);
    };
    paint();
    return h('section', {},
      h('div', { class: 'row' }, h('div', {}, t('proxy_route'), h('small', {}, t('proxy_desc'))), badge),
      h('div', { class: 'row', style: 'display:block' }, list),
      h('div', { class: 'row' }, h('div', {}, t('proxy_test_title'), result), testBtn));
  }

  const views = {
    settings() {
      const home = h('input', { type: 'text', spellcheck: 'false' });
      home.value = D.settings.homepage;
      home.onchange = () => set('homepage', home.value);
      home.onkeydown = (e) => { if (e.key === 'Enter') home.blur(); };

      const pw = ['current_password', 'new_password_hint', 'repeat_new_password'].map(p => h('input', { type: 'password', placeholder: t(p) }));
      const pwBtn = h('button', { class: 'btn primary' }, t('change_password'));
      pwBtn.onclick = () => {
        if (pw[1].value !== pw[2].value) return toast(t('new_pw_mismatch'), true);
        if ([...pw[1].value].length < 8) return toast(t('new_pw_too_short'), true);
        pwBtn.disabled = true; pwBtn.textContent = t('changing');
        setTimeout(() => send('change-pw:' + JSON.stringify({ old: pw[0].value, new: pw[1].value })), 60);
      };
      window.pwResult = (ok, msg) => {
        pwBtn.disabled = false; pwBtn.textContent = t('change_password');
        toast(msg, !ok);
        if (ok) pw.forEach(i => i.value = '');
      };

      return [
        header(t('settings')),
        h('h2', {}, t('general')),
        h('section', {}, defaultBrowserRow()),
        h('h2', {}, t('search')),
        h('section', {}, row(t('default_search'), t('default_search_desc'), select('search', D.engines))),
        h('h2', {}, t('startup')),
        h('section', {},
          row(t('homepage'), t('homepage_desc'), home),
          row(t('on_startup'), null, seg('startup', [['home', t('startup_home')], ['last', t('startup_last')]]))),
        h('h2', {}, t('appearance')),
        h('section', {},
          row(t('language'), t('language_hint'), languageSelect()),
          row(t('theme'), null, seg('theme', [['dark', t('theme_dark')], ['light', t('theme_light')], ['system', t('theme_system')]])),
          row(t('default_zoom'), '⌘+ / ⌘− / ⌘0', select('zoom', [0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2].map(z => [z, Math.round(z * 100) + ' %'])))),
        h('h2', {}, t('performance')),
        h('section', {},
          row(t('unload_after'), t('unload_desc'),
            select('unload', [[1, t('unload_minute', 1)], [5, t('unload_minutes', 5)], [15, t('unload_minutes', 15)], [30, t('unload_minutes', 30)], [60, t('unload_hour')], [0, t('never')]])),
          row(t('clarity_setting'), t('clarity_setting_desc'), seg('clarity', [['on', t('switch_on')], ['off', t('switch_off')]])),
          row(t('clarity_sharpen'), t('clarity_sharpen_desc'), seg('clarity_sharpen', [['on', t('switch_on')], ['off', t('switch_off')]]))),
        h('h2', {}, t('proxy_section')),
        proxySection(),
        h('h2', {}, t('privacy')),
        h('section', {},
          row(t('adblock_full'), t('adblock_desc', '~/Library/Application Support/Crow/blocklist.txt'),
            seg('adblock', [['on', t('switch_on')], ['off', t('switch_off')]])),
          adblockLists(),
          row(t('gamepad_setting'), t('gamepad_setting_desc'), seg('gamepad_enabled', [['on', t('switch_on')], ['off', t('switch_off')]])),
          row(t('gamepad_test'), t('gamepad_test_desc'), h('button', { class: 'btn', onclick: () => send('open-new:crow:gamepad') }, t('gamepad_test_open'))),
          row(t('whitelist'), D.allow.length ? null : t('whitelist_empty'),
            D.allow.length ? h('div', {}, ...D.allow.map(d => {
              const b = h('button', { class: 'btn', title: t('remove_exception') }, d + ' ×');
              b.onclick = () => { send('adblock-allow:' + d); b.remove(); };
              return b;
            })) : null),
          row(t('clear_history'), null, confirmBtn(t('clear_data'), () => { send('clear:history'); toast(t('history_cleared')); })),
          row(t('clear_cookies'), t('clear_cookies_desc'), confirmBtn(t('clear_data'), () => { send('clear:cookies'); toast(t('cookies_cleared')); })),
          row(t('clear_downloads'), t('clear_downloads_desc'), confirmBtn(t('clear_data'), () => { send('clear:downloads'); toast(t('list_cleared')); }))),
        h('h2', {}, t('encryption')),
        h('section', {},
          row(t('vault_title'), t('vault_desc'),
            h('button', { class: 'btn', onclick: () => send('lock') }, t('lock') + ' (⌃⌘L)')),
          h('div', { class: 'pw' }, ...pw, pwBtn)),
        h('h2', {}, t('updates')),
        h('section', {},
          row('CrowBrowser ' + D.version, null,
            h('button', { class: 'btn', onclick: () => { send('update-check'); toast(t('checking')); } }, t('check_updates'))),
          row(t('auto_updates'), t('auto_updates_desc'),
            seg('updates', [['on', t('switch_on')], ['off', t('switch_off')]]))),
      ];
    },

    about() {
      const REPO = 'https://github.com/AnubisSK/CrowBrowser';
      const link = (label, url) => h('button', { class: 'btn', onclick: () => send('open-new:' + url) }, label);
      const p = (text) => h('div', { class: 'row' }, h('div', {}, text));
      return [
        header(t('about')),
        h('section', {},
          row('CrowBrowser ' + D.version, t('about_desc'), link('GitHub', REPO)),
          row(t('author'), 'AnubisSVK (GitHub: AnubisSK)', link(t('profile'), 'https://github.com/AnubisSK')),
          row(t('license'), t('license_desc'), link(t('license_text'), REPO + '/blob/main/LICENSE'))),
        h('h2', {}, t('why_crow')),
        h('section', {}, ...['why_1', 'why_2', 'why_3', 'why_4', 'why_5'].map(k => p(t(k)))),
        h('h2', {}, t('technologies')),
        h('section', {},
          row(t('engine'), t('engine_desc'), null),
          row(t('lang_libs'), 'Rust · tao · wry · mimalloc · argon2 · chacha20poly1305 · zeroize', null)),
      ];
    },

    update() {
      const u = D.update;
      if (!u) return [header(t('update_title')), h('section', {},
        row(t('up_to_date', D.version), null,
          h('button', { class: 'btn', onclick: () => send('update-check') }, t('check_again'))))];
      const get = u.asset
        ? h('button', { class: 'btn primary', onclick: () => send('update-get') }, D.updateBusy ? t('downloading') : t('download_installer'))
        : h('button', { class: 'btn', onclick: () => send('open-new:' + u.page) }, t('open_github'));
      if (D.updateBusy) get.disabled = true;
      const list = h('div', { class: 'list' });
      if (!u.notes.length) list.append(h('div', { class: 'empty' }, t('no_notes')));
      for (const n of u.notes) list.append(h('div', { class: 'item' },
        h('div', { class: 'main', onclick: () => send('open-new:' + n.url), title: n.url },
          h('div', { class: 'title' }, n.msg), h('div', { class: 'sub' }, n.sha))));
      return [
        header(t('update_title')),
        h('section', {},
          row(t('update_ready', u.version), t('installed_version', D.version) +
            (u.asset ? ' · ' + u.asset.name + ' (' + (u.asset.size / 1048576).toLocaleString(currentLanguage(), { maximumFractionDigits: 1 }) + ' MB). ' + t('installer_note') : ''), get)),
        h('h2', {}, t('whats_new')),
        list,
      ];
    },

    history() {
      const search = h('input', { type: 'search', placeholder: t('search_history') });
      search.value = query;
      search.oninput = () => { query = search.value; renderList(); };
      const listWrap = h('div');
      function renderList() {
        const q = query.toLowerCase();
        const items = D.history.filter(e => !q || e.url.toLowerCase().includes(q) || (e.title || '').toLowerCase().includes(q));
        if (!items.length) return listWrap.replaceChildren(h('div', { class: 'list' }, h('div', { class: 'empty' }, t(q ? 'nothing_found' : 'history_empty'))));
        const out = []; let day = null, list = null;
        for (const e of items.slice(0, 1000)) {
          const d = fmtDay(e.time);
          if (d !== day) { day = d; out.push(h('h3', {}, d)); list = h('div', { class: 'list' }); out.push(list); }
          list.append(h('div', { class: 'item' },
            h('span', { class: 'time' }, fmtTime(e.time)),
            h('div', { class: 'main', onclick: (ev) => openUrl(e.url, ev), title: e.url },
              h('div', { class: 'title' }, e.title || host(e.url)), h('div', { class: 'sub' }, e.url)),
            h('button', { class: 'del', title: t('remove'), onclick: () => send('hist-del:' + e.time) }, '×')));
        }
        listWrap.replaceChildren(...out);
      }
      renderList();
      setTimeout(() => search.focus(), 0);
      return [header(t('history'), search, confirmBtn(t('clear_all'), () => send('clear:history'))), listWrap];
    },

    bookmarks() {
      const list = h('div', { class: 'list' });
      if (!D.bookmarks.length) list.append(h('div', { class: 'empty' }, t('bookmarks_empty')));
      for (const b of D.bookmarks) list.append(h('div', { class: 'item' },
        h('div', { class: 'main', onclick: (ev) => openUrl(b.url, ev), title: b.url },
          h('div', { class: 'title' }, b.title || host(b.url)), h('div', { class: 'sub' }, b.url)),
        h('button', { class: 'del', title: t('remove'), onclick: () => send('bm-del:' + b.url) }, '×')));
      return [header(t('bookmarks')), list];
    },

    // Sites with cookies in the vault. Data is sanitized in Rust: no cookie values, no passwords.
    logins() {
      const list = h('div', { class: 'list' }, h('div', { class: 'empty' }, t('loading')));
      window.setSessions = (rows) => {
        if (section !== 'logins') return;
        if (!rows.length) return list.replaceChildren(h('div', { class: 'empty' }, t('no_sessions')));
        list.replaceChildren(...rows.map(r => {
          const row = h('div', { class: 'item' },
            h('span', { class: 'fdot' + (r.has_session ? ' on' : '') }),
            h('div', { class: 'main', onclick: (ev) => openUrl('https://' + r.domain, ev), title: r.domain },
              h('div', { class: 'title' }, r.domain),
              h('div', { class: 'sub' }, (r.last_used ? t('last_used', fmtDay(r.last_used) + ' ' + fmtTime(r.last_used)) : t('no_history')) + ' · ' + t('cookies_count', r.cookies))),
            h('span', { class: 'user', title: t('no_names_stored') }, r.username || '—'),
            h('span', { class: 'badge' + (r.has_session ? ' on' : '') }, t(r.has_session ? 'active_session' : 'cookies_only')),
            confirmBtn(t('revoke'), () => { send('delete-vault-session:' + r.domain); row.remove(); }));
          return row;
        }));
      };
      send('get-vault-sessions');
      return [
        header(t('active_sessions')),
        h('p', { class: 'note', style: 'color:var(--mute);margin:-8px 4px 14px;font-size:12px' },
          t('sessions_note')),
        list,
      ];
    },

    downloads() {
      const label = { active: t('downloading'), done: t('dl_done'), failed: t('dl_failed') };
      const list = h('div', { class: 'list' });
      if (!D.downloads.length) list.append(h('div', { class: 'empty' }, t('no_downloads')));
      for (const d of D.downloads) {
        const name = d.path.split('/').pop();
        list.append(h('div', { class: 'item' },
          h('div', { class: 'main', onclick: () => d.state === 'done' && send('reveal-file:' + d.path), title: d.path },
            h('div', { class: 'title' }, name), h('div', { class: 'sub' }, host(d.url) + ' · ' + fmtDay(d.time) + ' ' + fmtTime(d.time))),
          h('span', { class: 'state ' + d.state }, label[d.state] || d.state),
          d.state === 'done' ? h('button', { class: 'btn', onclick: () => send('reveal-file:' + d.path) }, t('show_in_finder')) : null));
      }
      return [header(t('downloads'), confirmBtn(t('clear_list'), () => send('clear:downloads'))), list];
    },
  };

  // UI language (sent as `set-language:<code>`, stored in the vault; all UI views switch at once).
  function languageSelect() {
    const s = h('select', { id: 'lang-select' });
    for (const [v, label] of [['sk', 'Slovenčina'], ['cs', 'Čeština'], ['en', 'English'], ['de', 'Deutsch']])
      s.add(new Option(label, v, false, v === currentLanguage()));
    s.onchange = () => send('set-language:' + s.value);
    return s;
  }
  window.onLanguage = () => { news.textContent = t('whats_new_version', D.version); render(); };

  function render() {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.s === section));
    root.replaceChildren(...views[section]());
  }
  function show(s) { if (views[s]) { section = s; render(); } }
  function setData(d) {
    const keep = D.settings;
    const lists = JSON.stringify(D.adblockLists);
    D = d; D.settings = keep;
    if (section !== 'settings' || JSON.stringify(D.adblockLists) !== lists) render();
  }

  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { show(b.dataset.s); send('panel-section:' + b.dataset.s); });
  // Built-in offline changelog, opened in a new tab (no network, no IPC there).
  const news = document.getElementById('news');
  news.textContent = t('whats_new_version', D.version);
  news.onclick = () => send('open-new:crow:changelog');
  document.onkeydown = (e) => { if (e.key === 'Escape' && !['INPUT', 'SELECT'].includes(document.activeElement.tagName)) send('panel-close'); };
  render();
</script>
</body>
</html>
