<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>{{passwords}}</title>
<!-- Static: the body is rendered by Crow (Session::passwords_html), values escaped; passwords are never part of it. -->
<style>
  :root { color-scheme: dark; --bg: #0b0d11; --card: #14171f; --line: #232834; --fg: #e6e6e9; --mute: #8a90a2; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Inter", "Cantarell", "Noto Sans", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 36px 28px 56px; }
  h1 { font-size: 24px; font-weight: 600; }
  .lead { color: var(--mute); margin: 6px 0 22px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin-bottom: 16px; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  tr:first-child td { border-top: 0; }
  td:first-child { color: var(--mute); padding-right: 12px; }
  td.n { text-align: right; color: var(--mute); width: 90px; }
  .note { color: var(--mute); font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>
<main>
  <h1>🔑 {{passwords}}</h1>
  <p class="lead">{{pw_lead}}</p>
<!--STATS-->
</main>
</body>
</html>
