<!doctype html>
<html lang="{{@lang}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'none'; frame-ancestors 'none';">
<title>{{sh_title}}</title>
<!-- Static: the body is rendered by Crow (Session::shields_html), values escaped. -->
<style>
  :root { color-scheme: dark; --bg: #0b0d11; --card: #14171f; --line: #232834; --fg: #e6e6e9; --mute: #8a90a2; --accent: #6366f1; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, BlinkMacSystemFont, system-ui, "Inter", "Cantarell", "Noto Sans", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 36px 28px 56px; }
  h1 { font-size: 24px; font-weight: 600; }
  .lead { color: var(--mute); margin: 6px 0 22px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; }
  .tile { padding: 14px 16px; }
  .num { font-size: 28px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .lbl { color: var(--mute); font-size: 12px; margin-top: 2px; }
  section { padding: 16px 20px; margin-bottom: 16px; }
  h2 { font-size: 14px; font-weight: 600; margin-bottom: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
  tr:first-child td { border-top: 0; }
  td:first-child { color: var(--mute); padding-right: 12px; }
  td.n { text-align: right; color: var(--fg); font-variant-numeric: tabular-nums; width: 80px; }
  .note { color: var(--mute); font-size: 12px; margin-top: 6px; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--mute); }
  .dot.personal { background: #3b82f6; } .dot.work { background: #f59e0b; } .dot.isolated { background: #a855f7; }
</style>
</head>
<body>
<main>
  <h1>🛡️ {{sh_title}}</h1>
  <p class="lead">{{sh_lead}}</p>
<!--STATS-->
</main>
</body>
</html>
