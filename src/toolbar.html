<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --bg: #1b1b1f; --nav: #232328; --line: #2c2c31; --fg: #e6e6e9; --mute: #8e8e96; --icon: #c9c9ce;
    --hover: #2e2e34; --active: #38383f; --input: #2a2a2f; --input-focus: #18181b; --accent: #5b8def;
    --tab: transparent; --tab-on: #232328; --lights-off: #4a4a50;
  }
  @media (prefers-color-scheme: light) {
    :root {
      color-scheme: light;
      --bg: #e9e9ed; --nav: #f7f7f9; --line: #d6d6dc; --fg: #1d1d1f; --mute: #6e6e76; --icon: #4a4a50;
      --hover: #dcdce2; --active: #cfcfd6; --input: #e6e6eb; --input-focus: #fff; --tab-on: #f7f7f9; --lights-off: #d1d1d6;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    display: flex; flex-direction: column; background: var(--bg);
    font: 13px -apple-system, BlinkMacSystemFont, system-ui, "Inter", "Cantarell", "Noto Sans", sans-serif; color: var(--fg);
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  .row { display: flex; align-items: center; gap: 4px; flex: none; }
  #tabrow { height: 36px; padding: 6px 8px 0 80px; align-items: stretch; }
  body.linux:not(.chrome) #tabrow { padding-left: 8px; }
  #nav { height: 40px; padding: 0 8px; background: var(--nav); border-bottom: 1px solid var(--line); }
  #find { height: 36px; padding: 0 8px; background: var(--nav); border-bottom: 1px solid var(--line); display: none; }
  body.finding #find { display: flex; }
  #ask { height: 36px; padding: 0 8px 0 12px; gap: 8px; background: var(--nav); border-bottom: 1px solid var(--line); display: none; }
  body.asking #ask { display: flex; }
  #ask > svg { color: var(--accent); flex: none; }
  #askrisk { flex: none; display: none; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; background: #e5534b; }
  #askrisk.show { display: inline-block; }
  #asktext { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #ask .txt { width: auto; padding: 0 12px; font: inherit; border: 1px solid var(--line); }
  #ask .txt.primary, #upd .txt.primary { background: var(--accent); color: #fff; border-color: transparent; }
  #upd { height: 36px; padding: 0 8px 0 12px; gap: 8px; background: var(--nav); border-bottom: 1px solid var(--line); display: none; }
  body.updating #upd { display: flex; }
  #upd > svg { color: var(--accent); flex: none; }
  #updtext { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #upd .txt { width: auto; padding: 0 12px; font: inherit; border: 1px solid var(--line); }
  #upd .txt:disabled { opacity: .6; }

  #tabs { display: flex; flex: 1; min-width: 0; gap: 2px; }
  .tab {
    flex: 1 1 200px; max-width: 220px; min-width: 48px; display: flex; align-items: center; gap: 6px;
    padding: 0 6px 0 10px; border-radius: 8px 8px 0 0; background: var(--tab); color: var(--mute);
    position: relative;
  }
  .tab:hover { background: var(--hover); color: var(--fg); }
  .tab.on { background: var(--tab-on); color: var(--fg); }
  .tab.asleep .t { opacity: .6; }
  .tab .t { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab.dragging { background: var(--active); color: var(--fg); z-index: 2; }
  .tab .fav { width: 16px; height: 16px; flex: none; border-radius: 3px; }
  .tab.loading .fav { display: none; }
  .tab:not(.loading) .fav + .dot { display: none; }
  /* Container tabs: colored stripe on top (own in-memory cookie/storage jar). */
  .tab[data-c]::before { content: ''; position: absolute; left: 8px; right: 8px; top: 0; height: 2px; border-radius: 0 0 2px 2px; }
  .tab[data-c="personal"]::before { background: #3b82f6; }
  .tab[data-c="work"]::before { background: #f59e0b; }
  .tab[data-c="isolated"]::before { background: #a855f7; }
  .tab .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--mute); flex: none; opacity: .5; }
  .tab.loading .dot { background: transparent; border: 2px solid var(--accent); border-right-color: transparent; animation: spin .8s linear infinite; opacity: 1; }
  .tab .x { width: 18px; height: 18px; border-radius: 4px; display: grid; place-items: center; opacity: 0; font-size: 14px; flex: none; }
  .tab:hover .x, .tab.on .x { opacity: .7; }
  .tab .x:hover { background: var(--active); opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  button {
    width: 30px; height: 28px; border: 0; border-radius: 7px; flex: none;
    background: transparent; color: var(--icon); display: grid; place-items: center; position: relative;
  }
  button:hover { background: var(--hover); color: var(--fg); }
  button:active, button.on { background: var(--active); color: var(--fg); }
  #newtab { height: 26px; align-self: center; margin-left: 2px; }
  svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .urlwrap { flex: 1; position: relative; margin: 0 6px; display: flex; }
  #url, #fq {
    flex: 1; height: 28px; padding: 0 34px 0 12px;
    border: 1px solid transparent; border-radius: 14px; outline: none;
    background: var(--input); color: var(--fg); font: inherit;
  }
  #url:focus, #fq:focus { background: var(--input-focus); border-color: var(--accent); }

  /* Connection security of the committed page: lock = HTTPS, red badge = plaintext HTTP */
  #sec { position: absolute; left: 4px; top: 4px; height: 20px; display: none; align-items: center; gap: 4px; padding: 0 6px; border-radius: 10px; font-size: 11px; z-index: 1; }
  #sec svg { width: 13px; height: 13px; }
  .urlwrap.https #sec, .urlwrap.http #sec { display: flex; }
  #sec:hover { background: var(--hover); }
  .urlwrap.http #sec:hover { background: rgba(229, 83, 75, .25); }
  .urlwrap.https #sec { color: var(--mute); }
  .urlwrap.https #sec .warn, .urlwrap.https #sec .txt { display: none; }
  .urlwrap.http #sec { color: #e5534b; background: rgba(229, 83, 75, .15); }
  .urlwrap.http #sec .lock { display: none; }
  .urlwrap.https #url { padding-left: 26px; }
  .urlwrap.http #url { padding-left: var(--secw, 122px); }
  .urlwrap:focus-within #sec { display: none; }
  .urlwrap:focus-within #url { padding-left: 12px; }
  #star { position: absolute; right: 2px; top: 0; width: 28px; }
  /* Logged-in indicator (login cookie for this site in the vault) */
  #login { position: absolute; right: 30px; top: 0; width: 28px; color: var(--accent); display: none; }
  .urlwrap.login #login { display: grid; }
  .urlwrap.login #url { padding-right: 60px; }
  #star.on { background: transparent; color: #f5c518; }
  #star.on svg { fill: #f5c518; }
  #shield.blocking { color: var(--accent); }
  #shield.off { opacity: .35; }
  #shieldn { position: absolute; top: 1px; right: 0; min-width: 14px; height: 14px; padding: 0 3px; border-radius: 7px;
    background: var(--accent); color: #fff; font-size: 9px; font-weight: 600; line-height: 14px; text-align: center; display: none; }
  #shield.blocking #shieldn.show { display: block; }
  /* A page read the gamepads: they are masked as one generic pad (click: what it got). */
  #pad { display: none; width: auto; max-width: 300px; gap: 6px; padding: 0 10px; margin-right: 2px; border-radius: 14px;
    grid-auto-flow: column; color: var(--accent); background: rgba(91, 141, 239, .12); font-size: 12px; }
  #pad.show { display: grid; animation: padin .35s ease-out; }
  #pad:hover { background: rgba(91, 141, 239, .22); color: var(--accent); }
  #pad .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @keyframes padin { from { opacity: 0; transform: translateY(-4px) scale(.96); } to { opacity: 1; transform: none; } }
  @media (max-width: 900px) { #pad .txt { display: none; } }
  #pip { display: none; color: var(--accent); }
  #pip.show { display: grid; animation: padin .35s ease-out; }
  /* CrowClarity (✨): shown with a video; lit while the tab's video is enhanced. */
  #clarity { display: none; font-size: 14px; line-height: 1; opacity: .5; }
  #clarity.show { display: grid; animation: padin .35s ease-out; }
  #clarity.on { opacity: 1; background: rgba(91, 141, 239, .14); }
  #clarity.flash { animation: clarityflash .6s ease-out; }
  @keyframes clarityflash { 0% { transform: scale(1); } 40% { transform: scale(1.25); } 100% { transform: scale(1); } }
  #dl.busy { color: var(--accent); }
  #dl.busy::after { content: ''; position: absolute; top: 5px; right: 5px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  #fq { flex: 0 1 320px; padding-right: 12px; }
  #fcount { color: var(--mute); min-width: 110px; padding: 0 8px; }
  .spacer { flex: 1; }

  #bar { position: absolute; left: 0; top: 74px; height: 2px; width: 0; background: var(--accent); opacity: 0; transition: width .4s ease, opacity .3s; }
  body.loading #bar { width: 70%; opacity: 1; }
  body.loading #reload .r { display: none; }
  body:not(.loading) #reload .s { display: none; }


  /* Linux (frameless): drawn copy of the macOS traffic lights */
  #lights { display: none; position: absolute; left: 13px; top: 12px; gap: 8px; z-index: 10; }
  body.chrome #lights { display: flex; }
  #lights span { width: 12px; height: 12px; border-radius: 50%; display: grid; place-items: center; }
  #lights .c { background: #ff5f57; } #lights .m { background: #febc2e; } #lights .x { background: #28c840; }
  body.blurred #lights:not(:hover) span { background: var(--lights-off, #4a4a50); }
  #lights svg { width: 8px; height: 8px; fill: none; stroke: rgba(0,0,0,.55); stroke-width: 3; stroke-linecap: round; opacity: 0; }
  #lights:hover svg { opacity: 1; }
  /* Windows (borderless, client-side decorations): the tab strip is the title bar. Its empty
     space moves the window, the 4 px strip on top resizes it, caption buttons on the right. */
  #caps, #rsz { display: none; }
  body.windows #tabrow { padding: 4px 0 0 8px; -webkit-app-region: drag; app-region: drag; }
  body.windows.maximized #tabrow { padding-top: 0; }
  body.windows .tab, body.windows #tabrow button { -webkit-app-region: no-drag; app-region: no-drag; }
  body.windows #caps { display: flex; align-self: stretch; margin: -4px 0 0 8px; }
  body.windows.maximized #caps { margin-top: 0; }
  #caps button { width: 46px; height: 100%; border-radius: 0; color: var(--fg); }
  #caps button:hover { background: var(--hover); }
  #caps button:active { background: var(--active); }
  #caps .close:hover { background: #e81123; color: #fff; }
  #caps .close:active { background: #f1707a; color: #fff; }
  body.blurred #caps button:not(:hover) { color: var(--mute); }
  #caps svg { width: 10px; height: 10px; stroke-width: 1; stroke-linecap: square; stroke-linejoin: miter; }
  #caps .restore, body.maximized #caps .max { display: none; }
  body.maximized #caps .restore { display: block; }
  body.windows:not(.maximized) #rsz { display: block; position: absolute; left: 0; right: 0; top: 0; height: 4px; z-index: 20;
    cursor: ns-resize; -webkit-app-region: no-drag; app-region: no-drag; }
  body.windows:not(.maximized) #rsz::before, body.windows:not(.maximized) #rsz::after { content: ''; position: absolute; top: 0; width: 8px; height: 4px; }
  body.windows:not(.maximized) #rsz::before { left: 0; cursor: nwse-resize; }
  body.windows:not(.maximized) #rsz::after { right: 0; cursor: nesw-resize; }

  #toast {
    position: absolute; right: 10px; top: 7px; max-width: 45%; padding: 4px 12px; border-radius: 12px;
    background: var(--accent); color: #fff; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    opacity: 0; transform: translateY(-4px); transition: .2s; pointer-events: none;
  }
  #toast.show { opacity: 1; transform: none; }
</style>
</head>
<body>
  <div id="lights">
    <span class="c" data-c="win-close"><svg viewBox="0 0 10 10"><path d="M2 2l6 6M8 2l-6 6"/></svg></span>
    <span class="m" data-c="win-min"><svg viewBox="0 0 10 10"><path d="M1.5 5h7"/></svg></span>
    <span class="x" data-c="win-max"><svg viewBox="0 0 10 10"><path d="M5 1.5v7M1.5 5h7"/></svg></span>
  </div>
  <div id="tabrow" class="row">
    <div id="tabs"></div>
    <button id="newtab" data-i18n-title="new_tab" data-hint=" (⌘T)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div id="caps">
      <button data-c="window-minimize"><svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg></button>
      <button data-c="window-maximize"><svg class="max" viewBox="0 0 10 10"><rect x=".5" y=".5" width="9" height="9"/></svg><svg class="restore" viewBox="0 0 10 10"><path d="M2.5 2.5V.5h7v7h-2"/><rect x=".5" y="2.5" width="7" height="7"/></svg></button>
      <button class="close" data-c="window-close"><svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg></button>
    </div>
  </div>
  <div id="rsz"></div>
  <div id="nav" class="row">
    <button id="back" data-i18n-title="back" data-hint=" (⌘[)"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="forward" data-i18n-title="forward" data-hint=" (⌘])"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="reload" data-i18n-title="reload" data-hint=" (⌘R)">
      <svg class="r" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      <svg class="s" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button id="home" data-i18n-title="home" data-hint=" (⌘⇧H)"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg></button>
    <div class="urlwrap">
      <span id="sec"><svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><svg class="warn" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.01"/></svg><span class="txt" data-i18n="http_insecure"></span></span>
      <input id="url" spellcheck="false" autocomplete="off" data-i18n-ph="search_or_enter_url">
      <button id="login" data-i18n-title="logged_in"><svg viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg></button>
      <button id="star" data-i18n-title="bookmark_page" data-hint=" (⌘D)"><svg viewBox="0 0 24 24"><path d="M12 2l3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8 5.8 21l1.2-6.8-5-4.9 6.9-1z"/></svg></button>
    </div>
    <button id="pip" data-i18n-title="pip_title"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="11" width="8" height="7" rx="1"/></svg></button>
    <button id="clarity" data-i18n-title="clarity_title"><span aria-hidden="true">✨</span></button>
    <button id="pad" data-i18n-title="gamepad_chip"><span aria-hidden="true">🎮</span><span class="txt" data-i18n="gamepad_chip"></span></button>
    <button id="shield" data-i18n-title="adblock"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg><span id="shieldn"></span></button>
    <button id="bms" data-i18n-title="bookmarks" data-hint=" (⌘⌥B)"><svg viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></button>
    <button id="hist" data-i18n-title="history" data-hint=" (⌘Y)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg></button>
    <button id="dl" data-i18n-title="downloads" data-hint=" (⌘⌥L)"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
    <button id="settings" data-i18n-title="settings" data-hint=" (⌘,)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </div>
  <div id="find" class="row">
    <input id="fq" spellcheck="false" autocomplete="off" data-i18n-ph="find_in_page">
    <span id="fcount"></span>
    <button id="fprev" data-i18n-title="find_prev" data-hint=" (⌘⇧G)"><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
    <button id="fnext" data-i18n-title="find_next" data-hint=" (⌘G)"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="spacer"></div>
    <button id="fclose" data-i18n-title="close" data-hint=" (Esc)"><svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div id="ask" class="row">
    <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
    <span id="askrisk"></span>
    <span id="asktext"></span>
    <div class="spacer"></div>
    <button id="askno" class="txt" data-i18n="deny"></button>
    <button id="askyes" class="txt primary" data-i18n="allow"></button>
  </div>
  <div id="upd" class="row">
    <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    <span id="updtext"></span>
    <div class="spacer"></div>
    <button id="updnotes" class="txt" data-i18n="whats_new"></button>
    <button id="updlater" class="txt" data-i18n="later"></button>
    <button id="updget" class="txt primary" data-i18n="download"></button>
  </div>
  <div id="bar"></div>
  <div id="toast"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const send = (m) => window.ipc.postMessage(m);
  // Window drag: plain left press on the empty strip itself, never on controls; the default
  // (focus/selection) is suppressed so WebKit does not handle the same press too. A double click
  // keeps its own meaning instead of starting a second drag.
  const dragOn = (el, ok) => el.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || e.detail > 1 || !ok(e) || e.target.closest('button, input, .tab, .no-drag')) return;
    e.preventDefault();
    send('drag');
  });
  const url = $('url'), fq = $('fq');
  let S = { tabs: [], active: 0 };

  const click = { login: 'panel:logins', newtab: 'new-tab', back: 'back', forward: 'forward', home: 'home', star: 'bookmark',
                  bms: 'panel:bookmarks', hist: 'panel:history', dl: 'panel:downloads',
                  settings: 'panel:settings', fclose: 'find-close' };
  for (const [id, cmd] of Object.entries(click)) $(id).onclick = () => send(cmd);
  $('reload').onclick = () => send(S.loading ? 'stop' : 'reload');
  // Shield: click = stats popover (per-site switch inside), ⌥/Alt+click = global switch.
  $('pad').onclick = () => send('gamepad-open:' + Math.round($('pad').getBoundingClientRect().left));
  $('pip').onclick = () => send('pip');
  $('clarity').onclick = () => {
    const b = $('clarity');
    b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
    send('clarity');
  };
  // "+" right click: open the new tab in a container.
  $('newtab').oncontextmenu = (e) => { e.preventDefault(); send('container-menu:' + Math.round($('newtab').getBoundingClientRect().left)); };
  $('shield').onclick = (e) => send(e.altKey ? 'toggle-adblock' : 'shield-open:' + Math.round($('shield').getBoundingClientRect().left));
  // Blocked loads on the current page (badge); pushed by the backend as they happen.
  function setBlocked(n) {
    const b = $('shieldn');
    b.textContent = n > 99 ? '99+' : String(n);
    b.classList.toggle('show', n > 0);
  }
  $('fnext').onclick = () => findStep(false);
  $('fprev').onclick = () => findStep(true);
  // Lock / "not secure" badge opens the site-info popover under it.
  $('sec').onclick = () => send('site-info:' + Math.round($('sec').getBoundingClientRect().left));
  $('askyes').onclick = () => S.ask && send('dl-allow:' + S.ask.id);
  $('askno').onclick = () => S.ask && send('dl-deny:' + S.ask.id);
  $('updnotes').onclick = () => send('update-show');
  $('updlater').onclick = () => send('update-dismiss');
  $('updget').onclick = () => send('update-get');

  url.onkeydown = (e) => {
    if (e.key === 'Enter') { send('go:' + url.value); url.blur(); }
    if (e.key === 'Escape') { url.value = S.url || ''; url.blur(); }
  };
  url.onfocus = () => setTimeout(() => url.select(), 0);

  dragOn($('tabrow'), (e) => e.target.id === 'tabrow' || e.target.id === 'tabs');
  document.querySelectorAll('#lights span').forEach(l => l.onclick = () => send(l.dataset.c));
  dragOn($('lights'), (e) => e.target.id === 'lights');
  function setFocus(on) { document.body.classList.toggle('blurred', !on); }
  // Windows caption buttons and top-edge resize (corners: 8 px).
  document.querySelectorAll('#caps button').forEach(b => b.onclick = () => send(b.dataset.c));
  function setMax(on) { document.body.classList.toggle('maximized', on); }
  $('rsz').addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    send('resize:' + (e.clientX < 8 ? 'nw' : e.clientX >= innerWidth - 8 ? 'ne' : 'n'));
  });
  $('tabrow').ondblclick = (e) => { if (e.target.id === 'tabrow' || e.target.id === 'tabs') send('new-tab'); };

  // Tab reordering: drag past the threshold, reorder the DOM live, commit the index on release.
  let drag = null, pendingState = null;
  const tabEl = (id) => document.querySelector('.tab[data-id="' + id + '"]');
  function dragEnd() {
    if (!drag) return;
    const d = drag; drag = null;
    const el = tabEl(d.id);
    if (d.on && el) {
      el.classList.remove('dragging');
      send('move-tab:' + d.id + ':' + [...$('tabs').children].indexOf(el));
    }
    if (pendingState) { const st = pendingState; pendingState = null; render(st); }
  }
  document.addEventListener('mousemove', (e) => {
    if (!drag) return;
    if (!(e.buttons & 1)) return dragEnd();
    if (!drag.on && Math.abs(e.clientX - drag.x) < 6) return;
    const el = tabEl(drag.id);
    if (!el) return;
    drag.on = true;
    el.classList.add('dragging');
    const others = [...$('tabs').children].filter(o => o !== el);
    const at = others.findIndex(o => { const r = o.getBoundingClientRect(); return e.clientX < r.left + r.width / 2; });
    const ref = at < 0 ? null : others[at];
    if (el.nextSibling !== ref || (ref === null && el !== $('tabs').lastChild)) $('tabs').insertBefore(el, ref);
  });
  // No blur handler: selecting the tab focuses its webview and would cancel the drag.
  document.addEventListener('mouseup', dragEnd);

  function render(st) {
    if (drag && drag.on) { pendingState = st; S = st; return; }
    S = st;
    const tabs = $('tabs');
    tabs.replaceChildren(...st.tabs.map((tab, i) => {
      const el = document.createElement('div');
      el.className = 'tab' + (i === st.active ? ' on' : '') + (tab.loading ? ' loading' : '') + (tab.asleep ? ' asleep' : '');
      el.dataset.id = tab.id;
      el.title = tab.title || t('new_tab');
      if (tab.c) { el.dataset.c = tab.c; el.title += ' · ' + t('ct_' + tab.c); }
      const dot = document.createElement('span'); dot.className = 'dot';
      const title = document.createElement('span'); title.className = 't'; title.textContent = tab.title || t('new_tab');
      const x = document.createElement('span'); x.className = 'x'; x.textContent = '×'; x.title = t('close_tab');
      x.onclick = (e) => { e.stopPropagation(); send('close-tab:' + tab.id); };
      el.onmousedown = (e) => {
        if (e.button !== 0 || e.target === x) return;
        drag = { id: tab.id, x: e.clientX, on: false };
        send('select:' + tab.id);
      };
      el.onauxclick = (e) => { if (e.button === 1) send('close-tab:' + tab.id); };
      if (tab.icon && tab.icon.startsWith('data:image/png;base64,')) {
        const fav = document.createElement('img'); fav.className = 'fav'; fav.src = tab.icon; fav.draggable = false; fav.alt = '';
        el.append(fav);
      }
      el.append(dot, title, x);
      return el;
    }));
    if (document.activeElement !== url) url.value = st.url;
    // Security state verified by the engine (backend `tls`), never derived from the URL scheme.
    const tls = st.tls || '';
    const wrap = url.parentElement;
    const warn = tls === 'http' || tls === 'mixed' || tls === 'broken';
    wrap.classList.toggle('https', tls === 'secure');
    wrap.classList.toggle('http', warn);
    $('sec').querySelector('.txt').textContent =
      t(tls === 'mixed' ? 'partially_secure' : tls === 'broken' ? 'certificate_error' : 'http_insecure');
    if (warn) requestAnimationFrame(() => wrap.style.setProperty('--secw', ($('sec').offsetWidth + 12) + 'px'));
    $('sec').title = tls ? t('site_info') : '';
    const a = st.ask;
    document.body.classList.toggle('asking', !!a);
    if (a) {
      let from = a.url; try { from = new URL(a.url).host || a.url.split(':')[0] + ':'; } catch {}
      $('asktext').textContent = t('download_prompt', a.name, from) + (a.more ? ' ' + t('download_more', a.more) : '');
      // Executable/script types: explicit warning badge next to the question.
      $('askrisk').textContent = a.risk ? '⚠ ' + t('dangerous_file_warning') + ' (.' + a.risk + ')' : '';
      $('askrisk').classList.toggle('show', !!a.risk);
    }
    const u = st.update;
    document.body.classList.toggle('updating', !!u);
    if (u) {
      $('updtext').textContent = t(u.busy ? 'update_downloading' : 'update_available', u.version);
      $('updget').disabled = !!u.busy;
      $('updget').style.display = u.asset ? '' : 'none';
    }
    document.body.classList.toggle('loading', st.loading);
    $('star').classList.toggle('on', st.bookmarked);
    url.parentElement.classList.toggle('login', !!st.login);
    const blocking = st.adblock && !st.siteAllowed;
    $('shield').classList.toggle('blocking', blocking);
    $('shield').classList.toggle('off', !blocking);
    $('shield').title = t('adblock') + ': ' + (!st.adblock ? t('adblock_off_everywhere') : st.siteAllowed ? t('adblock_off_for', st.host) : t('adblock_on'))
      + ' (' + t('shield_hint') + ')';
    setBlocked(st.blocked || 0);
    $('pad').classList.toggle('show', !!st.gamepad);
    $('pip').classList.toggle('show', !!st.video);
    $('clarity').classList.toggle('show', !!st.hasVideo);
    $('clarity').classList.toggle('on', !!st.clarity);
    $('dl').classList.toggle('busy', st.downloads > 0);
    for (const [id, sec] of [['bms', 'bookmarks'], ['hist', 'history'], ['dl', 'downloads'], ['settings', 'settings']])
      $(id).classList.toggle('on', st.panel === sec);
  }

  // Load started: spinner only, the address bar keeps the last finished URL (anti-spoofing).
  function setLoading(id, on) {
    const i = S.tabs.findIndex(t => t.id === id);
    if (i < 0) return;
    S.tabs[i].loading = on;
    const el = document.querySelector('.tab[data-id="' + id + '"]');
    if (el) el.classList.toggle('loading', on);
    if (i === S.active) { S.loading = on; document.body.classList.toggle('loading', on); }
  }

  function focusUrl() { url.focus(); url.select(); }

  // Language switched in Settings: static labels are redone by i18n.js, dynamic ones here.
  window.onLanguage = () => render(S);

  function toast(msg) {
    const el = $('toast');
    el.textContent = msg; el.classList.add('show');
    clearTimeout(el._h); el._h = setTimeout(() => el.classList.remove('show'), 2200);
  }

  // Find in page
  const findSend = (dir) => send('find:' + JSON.stringify({ q: fq.value, dir }));
  function findStep(back) { findSend(back ? 'prev' : 'next'); }
  function openFind() { document.body.classList.add('finding'); fq.focus(); fq.select(); if (fq.value) findSend('new'); }
  function closeFind() { document.body.classList.remove('finding'); $('fcount').textContent = ''; }
  function findCount(n) {
    $('fcount').textContent = fq.value ? (n ? t.plural(n, 'find_result') : t('find_none')) : '';
  }
  fq.oninput = () => findSend('new');
  fq.onkeydown = (e) => {
    if (e.key === 'Enter') findStep(e.shiftKey);
    if (e.key === 'Escape') send('find-close');
  };
</script>
</body>
</html>
